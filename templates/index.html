<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Matrimonio</title>

```
<style>
    body {
    margin: 0;
    font-family: Arial, sans-serif;

    background-image: url("/static/img/fondo.jpg");
    background-size: cover;        /* que cubra toda la pantalla */
    background-position: center;   /* centrada */
    background-repeat: no-repeat;  /* no repetir */
    background-attachment: fixed;  /* efecto elegante al hacer scroll */
}

    .wrapper {
        max-width: 600px;
        margin: 30px auto;
        background: rgba(255, 255, 255, 0.6);
        padding: 30px;
        /* border: 2px solid black; */
    
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .desc {
        text-align: center;
        margin-bottom: 30px;
        line-height: 1.5;
    }

    .item {
        display: flex;
        align-items: center;
        margin-bottom: 25px;
    }

    .item img {
        width: 80px;
        height: 80px;
        border: 2px solid black;
        margin-right: 20px;
    }

    .title {
        flex: 1;
        font-size: 18px;
    }

    .btn {
        padding: 10px 15px;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }

    .available {
        background: #b7d3a8;
    }

    .unavailable {
        background: #e6b89c;
    }

    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        justify-content: center;
        align-items: center;
    }

    .modal-box {
        background: white;
        padding: 20px;
        text-align: center;
        border-radius: 5px;
    }

    .modal-buttons {
        margin-top: 20px;
    }

    .modal-buttons button {
        margin: 0 10px;
        padding: 10px 20px;
        cursor: pointer;
    }
</style>
```

</head>

<body>

<div class="wrapper">
    <h1>Matrimonio</h1>

```
<div class="desc">
    Puedes reservar solo uno por persona. <br>
    Verde = disponible / Rojo = no disponible
</div>

{% for item in items %}
<div class="item">
    <img src="{{ item.image }}">

    <div class="title">
        - {{ item.title }}
    </div>

    <button class="btn {{ 'available' if item.available else 'unavailable' }}"
            onclick="openModal({{ item.id }}, {{ 'true' if item.available else 'false' }})">
        {{ 'Disponible' if item.available else 'No disponible' }}
    </button>
</div>
{% endfor %}
```

</div>

<div id="modal" class="modal">
    <div class="modal-box">
        <p>Confirma el regalo</p>

```
    <div class="modal-buttons">
        <button onclick="confirmAction()">Aceptar</button>
        <button onclick="closeModal()">Cancelar</button>
    </div>
</div>
```

</div>

<script>
let currentId = null;

function openModal(id, available) {
    if (!available) return;
    currentId = id;
    document.getElementById('modal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('modal').style.display = 'none';
}

function confirmAction() {
    fetch(`/toggle/${currentId}`, { method: 'POST' })
    .then(() => location.reload());
}
</script>

</body>
</html>
